# Site settings
#theme
theme: jekyll-theme-primer

#Site basics
title: "Vector of Research Labs: A Technical Threat Intel Site"
description: "Decoding threat actor intent through binary analysis and automated research. 
  Specializing in malware internals, firmware vulnerabilities, and proactive defense."
url: "https://mja-reversing.github.io"
baseurl: ""

# Author Info
author:
  name: "Matt Allan"
  bio: "Technical Security Researcher specializing in the intersection of malware internals 
    and adversary intelligence. Leveraging automated analysis pipelines to transform 
    deep-dive RE into scalable threat intelligence."

# Navigation
navbar:
  - title: "Home"
    url: "/"
  - title: "About"
    url: "/about/"
  - title: "Research"
    url: "/research/"

# Markdown & Syntax Highlighting
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Blog Post Settings
permalink: /research/:title/
paginate: 5
paginate_path: "/page:num/"

# Collections (lets you expand later)
collections:
  notes:
    output: true
    permalink: /notes/:path/

# Defaults (auto-apply layouts)
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

# Plugins supported by GitHub Pages
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclusions (files not published)
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

favicon: assets/images/favicon.ico
